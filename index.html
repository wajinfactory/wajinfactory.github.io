<aside class="sidebar"><a class="brand" href="#matrix"><span class="brand-icon">L</span>エルメ<span class="brand-small">管理画面</span></a><div class="account"><span class="salon-icon">T</span><div>hair salon Tsumugi<small>LINE公式アカウント</small></div><span class="connected"></span></div><div class="nav-label">友だちとの最初の接点</div><nav aria-label="メインナビゲーション"><button data-screen="matrix"><span>▦</span>ウェルカムフロー</button><button data-screen="editor"><span>≡</span>フロー編集</button><button data-screen="studio"><span>▧</span>リッチメニュースタジオ</button><button data-screen="simulator"><span>▷</span>ペルソナ・シミュレーター</button><button data-screen="publish"><span>✓</span>QR対象変更・公開前チェック</button><button data-screen="document"><span>▤</span>提案ドキュメント</button></nav><div class="sidebar-bottom"><span class="mock-dot"></span>プロトタイプ / モックデータ<small>実際のLINE配信は行われません</small></div></aside>
<div class="workspace"><header class="topbar"><span>友だち管理 <span class="crumb">/</span> <span id="breadcrumb">ウェルカムフロー</span></span><div><span class="draft-dot"></span><span id="publication-status"></span> <span class="avatar">TS</span></div></header><main id="app"></main><footer>hair salon Tsumugi <span>Welcome Flow · Prototype</span></footer></div>
<div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');
const routes = ['通常追加','QR：店頭チラシ','QR：Instagram','QR：予約サイト'];
const statuses = ['新規','既存','ブロック解除'];
const definitions = ['初めて追加した友だち。友だち追加時に発火。','エルメ利用前からの友だち。メッセージ受信でエルメ上に表示された時に発火。経路非依存。','一度ブロックした後、解除した友だち。解除時に発火。'];
const names = {matrix:'ウェルカムフロー',editor:'フロー編集',studio:'リッチメニュースタジオ',simulator:'ペルソナ・シミュレーター',publish:'QR対象変更・公開前チェック',document:'提案ドキュメント'};
const clone = v => JSON.parse(JSON.stringify(v));
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count = v => Array.from(v).length;
const greeting = '友だち追加ありがとうございます！\nhair salon Tsumugiです。\n初回限定クーポンはメニューからご確認ください。';
const makeFlow = s => ({text:s===2?'おかえりなさい！最新のサロン情報をお届けします。':greeting,menu:s===2?'通常メニュー':'初回限定メニュー',step:s===2?'':'初回フォロー',tag:s===2?'再来店':'友だち追加',inherit:false,kind:'set',reason:''});
const initial = {flows:routes.map(()=>[makeFlow(0),null,makeFlow(2)]),existing:{...makeFlow(1),text:'いつもご利用ありがとうございます。',kind:'silent',reason:'移行前の友だちには個別対応するため'},qr:[false,false,true],qrMenus:['','初回限定メニュー',''],suppress:[false,false,false],menus:{'初回限定メニュー':{bar:'ご予約・クーポンはこちらからどうぞ',areas:['ご予約','クーポン','アクセス']},'通常メニュー':{bar:'ご予約・アクセス',areas:['次回のご予約','ヘアケア','アクセス']}}};
initial.flows[0][2]={...makeFlow(2),text:'',menu:'',step:'',tag:''};
initial.flows[2][2]=clone(initial.flows[0][2]);
initial.flows[1][2].inherit=true;
const state={screen:'matrix',route:0,status:0,draft:clone(initial),published:clone(initial),publishedAt:'2026/10/31 09:00（初期モック）',history:[],edit:null,menuEdit:null,error:'',stage:0};
function raw(model,r,s){return s===1?model.existing:model.flows[r][s];}
// All consumers use this evaluator. Existing-friend events never depend on a QR route.
function evaluate(model,r,s){
  const own=raw(model,r,s), source=s===2&&own.inherit?raw(model,r,0):own;
  const f=clone(source), inherited=s===2&&own.inherit;
  const sourceLabel=inherited?routes[r]+' / 新規':s===1?'既存友だち共通設定':routes[r]+' / '+statuses[s];
  let status;
  if(s!==1&&r>0&&s!==0&&!model.qr[r-1])status='対象外';
  else if(f.kind==='silent')status='意図的に停止';
  else if(![f.text,f.menu,f.step,f.tag].some(v=>v.trim()))status='未設定';
  else status=inherited?'継承中':'有効';
  const delivers=status==='有効'||status==='継承中';
  const duplicate=delivers&&s!==1&&r>0&&!!f.menu&&model.qrMenus[r-1]===f.menu&&!model.suppress[r-1];
  return {status,f,delivers,inherited,sourceLabel,duplicate,reason:status==='対象外'?'QRの対象が新規のみのため、ブロック解除は対象外':status==='意図的に停止'?f.reason:status==='未設定'?'本文とアクションが未設定':''};
}
function allCells(model){return routes.flatMap((_,r)=>statuses.map((_,s)=>({r,s,...evaluate(model,r,s)})));}
function checks(model=state.draft){
 const issues=[];
 for(const e of allCells(model)){
   // The existing column repeats the same event; inspect it once.
   if(e.s===1&&e.r!==0)continue;
   const title=e.s===1?'既存共通':routes[e.r]+' / '+statuses[e.s];
   if(e.status==='未設定')issues.push({type:'empty',r:e.r,s:e.s,title:title+'：未設定',severity:'warning'});
   if(e.f.kind==='silent'&&!e.f.reason.trim())issues.push({type:'reason',r:e.r,s:e.s,title:title+'：停止理由が必要',severity:'error'});
   if(e.status==='対象外')issues.push({type:'excluded',r:e.r,s:e.s,title:title+'：対象外（QRは新規のみ）',severity:'info'});
   if(e.duplicate)issues.push({type:'duplicate',r:e.r,s:e.s,title:title+'：メニュー表示が二重発動',severity:'error'});
 }
 for(const [id,m] of Object.entries(model.menus))if(count(m.bar)>14)issues.push({type:'bar',id,title:id+'：バー文言が設計上の14文字を超過',severity:'warning'});
 return issues;
}
const changed=()=>JSON.stringify(state.draft)!==JSON.stringify(state.published);

function head(title,desc,button=''){return `<div class="page-head"><div><div class="eyebrow">WELCOME FLOW · 検証用モック</div><h1>${title}</h1><p class="subtext">${desc}</p></div>${button}</div>`;}

function note(){return changed()?'<div class="alert">下書きに未公開の変更があります。一覧・シミュレーターは公開版を表示しています。</div>':'';}
function selectors(){return `<div class="field-row"><label>流入経路<select id="route">${routes.map((v,i)=>`<option value="${i}" ${i===state.route?'selected':''}>${v}</option>`).join('')}</select></label><label>友だち状態<select id="status">${statuses.map((v,i)=>`<option value="${i}" ${i===state.status?'selected':''}>${v}</option>`).join('')}</select></label></div><p>${definitions[state.status]}</p>${state.status===1?'<div class="info">全経路が同じ既存共通設定を参照します。QRの読取による発火ではありません。利用開始が同時なら既存友だちは存在しません。</div>':''}`;}

function matrix(){const cells=allCells(state.published),valid=cells.filter(e=>e.delivers).length,empty=cells.filter(e=>e.status==='未設定').length;

function editorModel(){const m=clone(state.draft);if(state.status===1)m.existing=state.edit;else m.flows[state.route][state.status]=state.edit;return m;}
function preview(e,model,stage=3){const m=model.menus[e.f.menu];return `<div class="phone"><div class="phone-status">9:41</div><div class="phone-header">hair salon Tsumugi</div><div class="chat">${!e.delivers?'<div class="bubble">何も届きません<br>'+esc(e.reason)+'</div>':stage===0?'<div class="bubble">再生前</div>':(e.f.text?'<div class="bubble">'+esc(e.f.text)+'</div>':'<div class="bubble">本文なし</div>')}</div>${e.delivers&&stage>=2&&m?`<div class="rich-grid">${m.areas.map(a=>`<div class="rich-tile">${esc(a)}</div>`).join('')}</div><div class="phone-bar">${esc(m.bar)}</div>`:''}</div><div class="summary-item">${badge(e)}<p>実効メニュー：${esc(e.delivers?e.f.menu||'なし':'なし')}</p><p>ステップ：${esc(e.delivers?e.f.step||'なし':'なし')} / タグ：${esc(e.delivers?e.f.tag||'なし':'なし')}</p></div>`;}

return head(names.editor,'本文＋アクション一式を下書きに保存します。公開版は公開操作まで変わりません。','<button class="primary" id="save">下書きに保存</button>')+`<div class="two-col"><div>${panel('編集する接点',selectors())}${panel('フローの設定',`<div class="save-state">${unsaved()?'未保存の編集あり':'保存済み下書き'}</div>${state.status===2?`<label class="inherit"><input type="checkbox" id="inherit" ${state.edit.inherit?'checked':''}>新規用をそのまま使う（本文＋メニュー表示・ステップ・タグ）</label>`:''}${e.inherited?'<div class="info">継承元：'+esc(e.sourceLabel)+'。以下は実効値の読み取り専用表示です。</div>':''}<label>配信方針<select id="delivery" ${e.inherited?'disabled':''}><option value="set" ${state.edit.kind!=='silent'?'selected':''}>配信する</option><option value="silent" ${state.edit.kind==='silent'?'selected':''}>意図的に送らない</option></select></label>${state.edit.kind==='silent'&&!e.inherited?`<label>送らない理由（必須）<input id="reason" value="${esc(state.edit.reason)}" aria-describedby="save-error" aria-invalid="${!!state.error}"></label>`:''}<p id="save-error" class="error" role="alert">${esc(state.error)}</p><label>あいさつ本文<textarea id="greeting" ${disabled?'readonly':''}>${esc(f.text)}</textarea></label>${[['menu','メニュー表示'],['step','ステップ'],['tag','タグ']].map(([key,label])=>`<label>${label}${key==='menu'?`<select id="${key}" ${disabled?'disabled':''}>${['',...Object.keys(model.menus)].map(v=>`<option value="${esc(v)}" ${f[key]===v?'selected':''}>${esc(v||'なし')}</option>`).join('')}</select>`:`<input id="${key}" value="${esc(f[key])}" ${disabled?'readonly':''}>`}</label>`).join('')}<button data-go="studio">選択フローのメニューを簡易編集</button>`)}</div><div id="preview">${panel('この接点で届く体験（編集中の実効値）',preview(e,model))}</div></div>`;
}
function studio(){const e=evaluate(state.draft,state.route,state.status),id=e.f.menu;
if(!id||!e.delivers)return head(names.studio,'初期メニューの簡易編集（下書き）')+selectors()+panel('選択中フローの実効プレビュー',preview(e,state.draft))+'<button data-go="editor">フローを編集</button>';
if(!state.menuEdit||state.menuEdit.id!==id)state.menuEdit={id,value:clone(state.draft.menus[id])};const m=state.menuEdit.value,model=clone(state.draft);model.menus[id]=m;
return head(names.studio,'初期メニューの簡易編集。画像制作・領域調整・遷移先設定は今回の対象外です。','<button class="primary" id="save-menu">メニューを下書き保存</button>')+selectors()+`<div class="two-col"><div>${panel(esc(id),`<div class="save-state">${unsaved()?'未保存の編集あり':'保存済み下書き'}</div><label>メニューバー文言<input id="bar-input" value="${esc(m.bar)}"></label><p id="bar-count">${count(m.bar)} / 14文字（設計上の前提・公式未確認）</p><p>端末上での省略位置は未検証です。</p>${m.areas.map((a,i)=>`<label>エリア${i+1}の表示ラベル<input data-area="${i}" value="${esc(a)}"></label>`).join('')}<div class="alert">AI短縮候補（固定モック）：ご予約・クーポン。候補を確認し、採用する場合だけ適用してください。<button id="shorten">候補を適用</button></div><p>AI未接続。生成失敗時は候補を適用せず手入力を継続する想定です。</p>`)}</div><div id="preview">${panel('選択フローの実効プレビュー（下書き）',preview(e,model))}</div></div>`;

function simulator(){const e=evaluate(state.published,state.route,state.status);return head(names.simulator,'公開版に基づき、選択した接点の実効内容を再生します。')+note()+`<div class="two-col"><div>${panel('確認する接点',selectors()+`<div class="actions"><button class="primary" id="play">体験を再生</button><button id="next-step">次のステップ</button></div><p>表示段階：${state.stage} / 3（本文 → メニュー → ステップ・タグの確認）</p>`)}${panel('評価結果',badge(e)+`<p>${esc(e.reason||'本文とアクションを実効値で表示しています。')}</p>${e.duplicate?'<div class="alert">メニュー表示の二重発動があります。公開前チェックで重複を抑制してください。</div><button data-go="publish">二重発動を解消する</button>':''}`)}<div class="info">現行仕様ではアクションの実行順は保証されません。本提案ではフロー内の順序指定を新仕様に含めます。これは待ち時間を省いたモック再生です。</div></div><div>${preview(e,state.published,state.stage)}</div></div>`;}
const rules = ['QR対象変更は今後の読取にのみ適用し、過去の友だちへ再実行しません。','あいさつとQRアクションが競合した場合はあいさつフローを優先し、重複するメニュー表示を抑制します。既存の未解決設定は公開前に明示的に解消します。','継承は本文＋アクション一式（メニュー表示・ステップ・タグ）。継承元を更新すると継承先の下書き実効値にも反映されますが、公開には再公開が必要です。','既存設定は移行時にそのまま初期値として取り込みます。','切替予約・版の復元は未実装の将来案です。'];
function publish(){const issues=checks(),errors=issues.filter(x=>x.severity==='error'),warnings=issues.filter(x=>x.severity==='warning');return head(names.publish,'保存済み下書きの全接点をルールで検査します。','<button class="primary" id="publish">公開する</button>')+`<p>重大エラー ${errors.length}件 / 許容警告 ${warnings.length}件 / 対象外 ${issues.filter(x=>x.severity==='info').length}件</p>${unsaved()?'<div class="alert">未保存の編集があります。編集画面で下書き保存してから公開してください。</div>':''}`+panel('QRコードの稼働対象（下書き）',`<p>人数は過去30日の読取実績から試算したモック値です。将来の配信人数ではありません。「全員」は新規以外の読取者も含む意味で、既存友だち用の発火とは別です。</p>${routes.slice(1).map((v,i)=>`<div class="qr-row"><strong>${v}</strong><label>稼働対象<select data-qr="${i}"><option value="false" ${!state.draft.qr[i]?'selected':''}>新規のみ</option><option value="true" ${state.draft.qr[i]?'selected':''}>全員</option></select></label><span>試算 ${[186,324,142][i]+(state.draft.qr[i]?[82,56,38][i]:0)}人</span></div>`).join('')}`)+panel('公開前チェック（ルールベース）',`<p>既存共通は1イベントとして検査。対象外は情報、未設定・設計上の文字数超過は許容警告、理由不足・二重発動は公開を止める重大エラーです。</p><div id="checks">${issues.map((c,i)=>`<div class="check-row" data-issue="${c.type}"><div><h3>${esc(c.title)}</h3><p>${c.severity==='error'?'重大エラー':c.severity==='warning'?'許容警告':'情報'}</p></div>${c.type==='duplicate'?`<button class="primary" data-resolve="${c.r-1}">あいさつを優先しQRの重複表示を止める</button>`:c.type==='excluded'?'':`<button data-fix="${i}">修正する</button>`}</div>`).join('')||'<p>検出事項なし</p>'}</div>`)+panel('仕様ルール','<ul>'+rules.map(v=>'<li>'+v+'</li>').join('')+'</ul>')+panel('公開履歴（ページ内のみ）',state.history.map(h=>`<p>${esc(h.date)}：${esc(h.text)}</p>`).join('')||'<p>このセッションでの公開はまだありません。編集中のQR変更は履歴に記録しません。</p>');}
function render(){
 $('#publication-status').textContent=(changed()?'下書きの変更あり / ':'')+'公開済み '+state.publishedAt;
 document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.screen===state.screen);b.setAttribute('aria-current',b.dataset.screen===state.screen?'page':'false');});
 $('#breadcrumb').textContent=names[state.screen];app.innerHTML=({matrix,editor,studio,simulator,publish,document:proposalDocument})[state.screen]();bind();
}
function refreshPreview(){const model=state.screen==='editor'?editorModel():clone(state.draft);if(state.screen==='studio'&&state.menuEdit)model.menus[state.menuEdit.id]=state.menuEdit.value;$('#preview').innerHTML=panel('この接点で届く体験（編集中の実効値）',preview(evaluate(model,state.route,state.status),model));if($('.save-state'))$('.save-state').textContent=unsaved()?'未保存の編集あり':'保存済み下書き';}
function bind(){
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 app.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{[state.route,state.status]=b.dataset.cell.split(',').map(Number);state.menuEdit=null;go('editor');});
 for(const key of ['route','status'])if($('#'+key))$('#'+key).onchange=e=>{state[key]=+e.target.value;state.edit=null;state.menuEdit=null;state.stage=0;state.error='';render();};
 if($('#inherit'))$('#inherit').onchange=e=>{state.edit.inherit=e.target.checked;render();};
 if($('#delivery'))$('#delivery').onchange=e=>{state.edit.kind=e.target.value;render();};
 for(const [id,key] of [['greeting','text'],['menu','menu'],['step','step'],['tag','tag'],['reason','reason']])if($('#'+id))$('#'+id).oninput=e=>{state.edit[key]=e.target.value;refreshPreview();};
 if($('#save'))$('#save').onclick=()=>{const e=evaluate(editorModel(),state.route,state.status);if(e.f.kind==='silent'&&!e.f.reason.trim()){state.error='送らない理由を入力してください。空欄では保存できません。';render();$('#reason')?.focus();return;}if(state.status===1)state.draft.existing=clone(state.edit);else state.draft.flows[state.route][state.status]=clone(state.edit);state.error='';render();toast('下書きに保存しました。公開版は変更されていません。');};

 if($('#shorten'))$('#shorten').onclick=()=>{state.menuEdit.value.bar='ご予約・クーポン';render();};
 if($('#save-menu'))$('#save-menu').onclick=()=>{state.draft.menus[state.menuEdit.id]=clone(state.menuEdit.value);render();toast('メニューを下書きに保存しました');};
 if($('#play'))$('#play').onclick=()=>{state.stage=3;render();};if($('#next-step'))$('#next-step').onclick=()=>{state.stage=Math.min(3,state.stage+1);render();};

}
function openPublish(){const errors=checks().filter(c=>c.severity==='error');if(errors.length||unsaved()){toast(errors.length?'重大エラーを解消してください。':'未保存の編集を下書き保存してください。');return;}const m=$('#modal');m.innerHTML=`<h2>保存済み下書きを公開しますか？</h2><p>許容警告 ${checks().filter(c=>c.severity==='warning').length}件。未設定では何も届きません。対象外と停止理由も確認してください。</p><button id="close-modal">キャンセル</button><button class="primary" id="confirm-publish">警告を確認して公開する</button>`;m.showModal();$('#close-modal').onclick=()=>m.close();$('#confirm-publish').onclick=()=>{const old=state.published;const changes=state.draft.qr.flatMap((v,i)=>v===old.qr[i]?[]:[routes[i+1]+'：'+(old.qr[i]?'全員':'新規のみ')+' → '+(v?'全員':'新規のみ')]);state.published=clone(state.draft);state.publishedAt=new Date().toLocaleString('ja-JP',{timeZone:'UTC'})+' UTC';state.history.unshift({date:state.publishedAt,text:changes.length?changes.join(' / '):'フロー・メニュー設定を公開（QR対象変更なし）'});m.close();render();toast('公開しました（実際の配信は行いません）');};}

const proposalMarkdown = "# 提案ドキュメント v2：ウェルカムフロー\n\nL Message（エルメ）UI/UXデザイナー職種別適性テスト／提案者：梶山 鉄矢\n\nモックデータによる検証用プロトタイプです。実際のLINE配信・外部公開・実機設定の変更は行いません。本文の正本は本v2で、プロトタイプ6画面目も同じ内容を表示します。\n\n## 対象領域の定義\n\nv1の「友だち追加から初回接点まで」を、追加・利用開始前の友だちからのメッセージ受信・ブロック解除という発火イベントごとに整理し直しました。あいさつ、QRアクション、初期メニュー表示を目的単位で見渡し、届かない接点を発見して修正・公開できることが中心提案です。\n\n## ① テーマ選定の理由\n\n本人経験（v1に記録された申告）：共通適性テストで美容室のLINE公式アカウントを構築した際、ブロック解除用の未設定、QR対象の作り直し、メニューの個別表示のやり直しに直面しました。経験の範囲を超える一般化はしません。\n\n公式仕様：QR対象の後変更には現行の制約があり、公式は作り直しによる迂回手順を説明しています。2025年7月にはブロック解除用が追加されています。「追加されたばかり」や「製品側が不整合を認識している」とは断定しません。\n\n仮説：初回や再接点の無反応は、予約機会の減少につながる可能性があります。ただし「最も離脱コストが高い」「そのまま売上損失」とする比較データ・因果の検証はありません。改善優先度は未設定発見と修正完了の検証から判断します。\n\n## ② 課題分析\n\n観察（v1の2026年10月31日読み取り調査記録）：1アカウントで既存友だち用が本文・アクションとも空、新規用と解除用に同文面が別登録されていました。既存用が不要な運用である可能性もあり、空欄だけを事故の証拠とはしません。メニュー一覧と個別表示の不一致も観察されていますが、原因は未特定です。今回の作業では実機を再操作していません。\n\n設計上の課題：設定の存在だけでは、対象条件に合うか・意図的な停止か・公開済みかが分かりません。v1では画面間でも判定が食い違っていました。v2は同じ評価ロジックと実効値に統一します。\n\n### 現行仕様との対応表\n\n| 現行の分類・条件 | v2での扱い・発火条件 |\n| --- | --- |\n| 新規友だち用：初めて追加した友だち | 新規列。友だち追加時に発火。QR経路は対象条件も評価する |\n| 既存友だち用：エルメ利用前からの友だちで、メッセージ受信によりエルメ上に表示された友だち | 既存列。経路非依存の共通設定1件を全行に再掲。QR読取では発火しない |\n| エルメと公式アカウントの利用開始が同時 | 既存友だちは存在しない。既存列にも条件を注記 |\n| ブロック解除友だち用：一度ブロックした後に解除した友だち | ブロック解除列。解除時に発火。QR経路の対象が新規のみなら対象外 |\n| QRの対象「全員」 | QR読取対象の範囲であり、公式の既存友だち用という分類とは別概念 |\n| 複数アクションの実行順は必ずしも上から順ではない | 現行の保証とは区別。本提案でフロー内の順序指定を新仕様として追加 |\n\n友だち分類と実行順の根拠：[公式あいさつマニュアル](https://lme.jp/manual/greetings/)。\n\n## ③ 提案内容\n\n### 6画面の役割と実装範囲\n\n- ウェルカムフロー：公開版の経路×状態を表示。既存列は共通設定の再掲で独立編集しません。件数は表示上の12接点を数え、共通設定の再掲も含むと注記します。\n- フロー編集：編集中の値をプレビューし、保存操作で下書きへ反映。本文＋メニュー表示・ステップ・タグを一式で継承します。継承中は全対象欄が読み取り専用、継承元を明示します。\n- リッチメニュースタジオ：初期メニューの簡易編集。メニューIDごとのバー文言・ラベルを保存し、選択フローの実効本文とメニューを表示。画像編集、タップ領域調整、遷移先設定は対象外です。\n- ペルソナ・シミュレーター：全経路・全状態を選択し、公開版の実効本文・メニュー・ステップ・タグを確認。現行では順序保証がない旨を表示します。\n- QR対象変更・公開前チェック：保存済み下書きの全接点をルールで評価し、修正後に再評価。二重発動はあいさつ優先を選び、QR側の重複メニューを抑制すると検出が消えます。\n- 提案ドキュメント：審査用の入口です。製品機能のナビへの追加を意図しません。実製品では既存のあいさつ設定から本領域へ進む構想で、既存の全ナビを置き換える提案ではありません。\n\n### 状態・保存・公開\n\n単一の評価関数が「有効／未設定／意図的に停止／対象外／継承中」を返し、マトリクス・編集・スタジオ・シミュレーター・公開前チェック・件数集計に共通利用します。QR対象外を先に判定し、配信対象でも停止や未設定なら「何も届きません」と表示。継承元が停止・未設定ならその状態も引き継ぎます。\n\n停止理由は必須です。空欄では保存できずエラーを表示します。本文がなくてもメニュー・ステップ・タグのいずれかがあればアクションのみの設定として扱います。\n\n入力中は「未保存の編集あり」、保存後は「保存済み下書き」。保存済み下書きと公開版は別のページ内状態です。ヘッダーに「下書きの変更あり」および「公開済み＋日時」を表示し、「公開する」でのみ公開版へ反映します。マトリクスとシミュレーターは公開版を表示し、未公開差分があれば注記します。QR対象変更は下書きとして保持し、公開時にだけ公開履歴へ記録します。再読込で状態は初期化され、永続化はありません。\n\n重大エラーは理由不足・二重発動で公開を止めます。未設定と設計上のバー文字数超過は許容警告で、確認モーダルを経て公開できます。対象外は条件の情報として表示します。既存列の重複表示は同一イベントのため検査を1回にまとめます。対象外も含めた全接点の評価結果から検出事項を動的生成します。\n\n### 仕様ルール\n\n- QR対象変更は今後の読取にのみ適用し、過去の友だちへ再実行しません。\n- あいさつとQRアクションが競合した場合はあいさつフローを優先し、重複するメニュー表示を抑制します。移行済みの未解決設定は重大エラーとして、公開前に抑制操作を必要とします。今回の競合検出対象は同じメニューの重複表示です。任意の外部アクション全般の競合解析は対象外です。\n- 継承元を更新すると、本文＋アクション一式（メニュー表示・ステップ・タグ）が継承先の下書き実効値にも反映されます。公開版への反映には再公開が必要です。\n- 既存設定は移行時にそのまま初期値として取り込み、勝手に継承や抑制へ変換しません。今回の初期値は移行検討用のモックです。\n- 現行仕様ではアクションの実行順は保証されません。本提案ではフロー内の順序指定を新仕様に含めます。再生は本文→メニュー→ステップ・タグを確認するモックで、実配信の保証ではありません。\n- 人数表示は過去30日の読取実績から試算したモック値です。実際の分析データには接続しておらず、将来の配信人数の確定値でもありません。\n- 切替予約・版の復元は未実装の将来案です。公開失敗時の再試行・永続的な復旧はバックエンド実装時の検討事項であり、今回はローカルの公開状態遷移までです。\n\n### AIと確定検査の分担\n\n未設定・文字数・対象外・設定上の重複はルールベースで検査します。AIを必須判定に使いません。AIは文面や短縮案の候補生成に限定する構想です。今回の短縮候補は固定モックで、適用前に候補を表示して運用者が採否を決めます。生成失敗時は適用せず手入力を続ける想定で、生成API自体は未接続です。最終的な配信方針と公開の責任は運用者が持ちます。\n\n### デザイン要件との対応\n\n指定色は維持します（メイン #08bf5a、メイン弱 #f4fbf2、メイン強 #23814d、テキスト #222222、リンク #5799DB、エラー #f44336、警告 #fea600）。主要ボタンはメイン強＋白文字。重要本文・状態・操作は14px／行間22px、12pxは時刻や補助情報に限定し、グレー文字は #595959 程度に調整しました。リンクは指定色を維持し下線と濃い背景で読みやすさを補います。タイトルは24pxです。\n\n「デザイン要件からの逸脱はありません」と断言するのではなく、要件を基準に可読性を修正した提案です。既存実画面との厳密な並置検証は未実施です。メニューバー表示名14文字は設計上の前提（公式未確認）で、実端末上の省略位置も未検証です。\n\n## ④ AI活用と本人の採否判断\n\nv1で記録した役割分担は、Museによる計画・調査・文章、Codex CLIによる実装、ChatGPT系列モデルによる調査補助です。実機調査は読み取り専用で行った記録を参照しました。今回のv2ではレビューを基に、状態の定義と画面間整合を修正しました。検証結果の正本は CHANGELOG_v3.md 末尾で、過去の実ブラウザ確認を今回の結果に代用しません。\n\n本人の具体的な採否判断（v1のテーマ決定記録と今回の修正指示に基づく）：\n\n1. Aのウェルカムフロー単独ではなく、Bのメニュー制作も含めることを本人が決定。AIはその決定を受け、初回接点という目的単位に統合しました。v2では制作機能の範囲を簡易編集と明示しています。\n2. v1の「既存＝すでに友だち」というAI実装をそのまま採用せず、本人が公式定義と経路非依存の前提を指定して修正を要求しました。修正版では共通設定1件を全行から参照し、QR対象と分類を分離しています。\n3. 本人は、固定3項目のチェックと修正できない二重発動をレビューのMustとして改修対象に指定しました。AIへの要求を「検出がある」から「発見→修正→警告解消が完走する」へ具体化し、今回の検証対象にしています。\n\n## 検証と改善成功の測り方\n\n中心デモ：公開版の未設定を発見→通常追加の解除用を新規から継承して保存→Instagramの二重発動を抑制→下書きを公開→一覧とシミュレーターで公開版を再確認します。停止＋理由必須、継承元の変更、QR対象外も確認対象です。\n\n今後のユーザーテスト案：2〜3名に同じ課題を試してもらい、未設定発見時間、修正から公開までの完了率、対象外・停止・未設定の取り違えを計測します。これは計画であり、実施済みの成果ではありません。\n\n## 提出URL・未確定事項\n\nデザイン成果物URL＝プロトタイプ。提案ドキュメントURL＝同URLの #document。直接開けるハッシュは #matrix、#editor、#studio、#simulator、#publish、#document です。\n\n恒常URLは未確定で、期限つきの暫定リンクは提出用にしません。外部公開と第三者の閲覧確認、本人の実務経験、実作業時間の集計は今回の制作側の対応範囲外として未完了を明示します。作業時間を目安レンジに合わせる記載は撤回し、実績を集計します。\n\n## 現行仕様の主な出典\n\n- [あいさつメッセージ](https://lme.jp/manual/greetings/)：分類・発火条件・複数アクションの順序。2026年10月31日に照合。\n- [2025年7月アップデート](https://lme.jp/manual/2025_7update/)：v1調査の出典。\n- [QRコードアクション](https://lme.jp/manual/inflow_route/)・[QR対象変更の迂回手順](https://lme.jp/manual/qr_cod_eaction_change_to_newfriends/)：v1調査の出典。\n- [リッチメニュー](https://lme.jp/manual/rich_menu/)・[ステップ配信FAQ](https://lme.jp/manual/step_faq/)：v1調査の出典。\n";

function inline(v){return esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');}
function proposalDocument(){
 const lines=proposalMarkdown.split('\n');let html='',table=false;
 for(const line of lines){
 if(line.startsWith('|')){if(!table){html+='<div class="doc-table"><table>';table=true;}if(/^\|\s*---/.test(line))continue;html+='<tr>'+line.split('|').slice(1,-1).map(v=>'<td>'+inline(v.trim())+'</td>').join('')+'</tr>';continue;}
 if(table){html+='</table></div>';table=false;}
 const h=line.match(/^(#{1,3}) (.*)$/);if(h)html+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;else if(line.trim())html+='<p>'+inline(line)+'</p>';
 }
 return '<article class="proposal-document panel">'+html+'</article>';
}

const initialScreen=location.hash.slice(1);if(names[initialScreen])state.screen=initialScreen;
render();
